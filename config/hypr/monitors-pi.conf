# Omarchy-Pi monitor defaults — straight 1x for 1080p/1440p Pi displays.
# See https://wiki.hyprland.org/Configuring/Monitors/
# (Upstream config/hypr/monitors.conf defaults to GDK_SCALE=2 retina.)
env = GDK_SCALE,1
monitor=,preferred,auto,1

# Uncomment for 4K Pi setups (fractional, heavier on V3D):
# env = GDK_SCALE,1.5
# monitor=,preferred,auto,1.5
