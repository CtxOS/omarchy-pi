# Omarchy-Pi look'n'feel — V3D-friendly: no blur/shadow, minimal animations.
# Source instead of default/hypr/looknfeel.conf on Pi (see install/config/hardware/pi.sh).
general {
    gaps_in = 4
    gaps_out = 6
    border_size = 1
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 0
    shadow {
        enabled = false
    }
    blur {
        enabled = false
    }
}

animations {
    enabled = yes, please :)
    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = quick,0.15,0,0.1,1
    animation = global, 1, 7, default
    animation = windows, 1, 3, easeOutQuint
    animation = fade, 1, 2, quick
    animation = workspaces, 0, 0, ease
}

dwindle {
    pseudotile = true
    preserve_split = true
    force_split = 2
}

master {
    new_status = master
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering  = true
    focus_on_activate = true
    vrr = 0
}
